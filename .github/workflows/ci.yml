name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          set +e
          npm ci > npm-ci.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::npm ci failed: $(tail -30 npm-ci.log | tr '\n' ' ' | cut -c1-1200)"
            cat npm-ci.log
          fi
          exit $code

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
